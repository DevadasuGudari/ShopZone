{% extends "base.html" %}
{% block title %}Login - ShopZone{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h3 class="mb-3">Login</h3>
    <form method="post">
      {% csrf_token %}
      {% if form.errors %}<div class="alert alert-danger">Invalid username or password.</div>{% endif %}
      <div class="mb-3"><label class="form-label">Username</label><input type="text" name="username" class="form-control" required autofocus></div>
      <div class="mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required></div>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn-warning w-100">Login</button>
    </form>
    <p class="mt-3 mb-0">New here? <a href="{% url 'signup' %}">Create an account</a></p>
  </div></div>
</div></div>
{% endblock %}
