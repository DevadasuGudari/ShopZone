{% extends "base.html" %}
{% block title %}Update Details - ShopZone{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h3 class="mb-3">Update Details</h3>
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
      <div class="mb-3">
        <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
      </div>{% endfor %}
      <button class="btn btn-warning w-100">Save Changes</button>
    </form>
    <div class="mt-3 d-flex justify-content-between">
      <a href="{% url 'password_change' %}">Change password</a>
      <a href="{% url 'orders:my_orders' %}">My orders</a>
    </div>
  </div></div>
</div></div>
{% endblock %}
