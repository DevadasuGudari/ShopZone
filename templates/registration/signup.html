{% extends "base.html" %}
{% block title %}Sign Up - ShopZone{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h3 class="mb-3">Create account</h3>
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
      <div class="mb-3">
        <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
      </div>{% endfor %}
      <button class="btn btn-warning w-100">Sign Up</button>
    </form>
    <p class="mt-3 mb-0">Already registered? <a href="{% url 'login' %}">Login</a></p>
  </div></div>
</div></div>
{% endblock %}
