<div class="card h-100 product-card shadow-sm">
  <a href="{{ p.get_absolute_url }}" class="text-decoration-none">
    {% if p.image %}
      <img src="{{ p.image.url }}" class="card-img-top product-img" alt="{{ p.name }}">
    {% else %}
      <div class="product-img placeholder-img">{{ p.category.icon|default:"📦" }}</div>
    {% endif %}
  </a>
  <div class="card-body d-flex flex-column">
    <small class="text-muted">{{ p.brand }}</small>
    <h6 class="card-title"><a href="{{ p.get_absolute_url }}" class="text-dark text-decoration-none">{{ p.name }}</a></h6>
    <div class="mb-2">
      <span class="fw-bold fs-5">₹{{ p.price }}</span>
      {% if p.discount_percent %}
        <small class="text-muted text-decoration-line-through ms-1">₹{{ p.mrp }}</small>
        <small class="text-success ms-1">{{ p.discount_percent }}% off</small>
      {% endif %}
    </div>
    <div class="mt-auto">
      {% if p.in_stock %}
      <form method="post" action="{% url 'cart:add' p.id %}">
        {% csrf_token %}
        <input type="hidden" name="quantity" value="1">
        <input type="hidden" name="next" value="{{ request.get_full_path }}">
        <button class="btn btn-warning btn-sm w-100">Add to Cart</button>
      </form>
      {% else %}
        <button class="btn btn-secondary btn-sm w-100" disabled>Out of stock</button>
      {% endif %}
    </div>
  </div>
</div>
